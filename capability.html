<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Capability Report</title>
<style>
    body {
        margin: 0;
        padding: 10px;
        background: #fff;
        color: #000;
        font-family: sans-serif;
        font-size: 15px;
        line-height: 1.4;
    }
    h1 { font-size: 22px; margin: 0 0 8px; border-bottom: 2px solid #000; padding-bottom: 4px; }
    #info { font-size: 13px; margin-bottom: 8px; word-wrap: break-word; }
    #info b { display: inline-block; min-width: 80px; }
    #summary { font-weight: bold; margin: 8px 0; }
    #controls button {
        font-size: 15px;
        padding: 6px 10px;
        margin: 0 4px 6px 0;
        background: #fff;
        color: #000;
        border: 2px solid #000;
        border-radius: 0;
    }
    #controls button.on { background: #000; color: #fff; }
    #log {
        display: block;
        width: 100%;
        height: 520px;
        box-sizing: border-box;
        -webkit-box-sizing: border-box;
        font-family: monospace;
        font-size: 12px;
        border: 1px solid #000;
        padding: 4px;
        white-space: pre;
        overflow: auto;
    }
    noscript { display: block; padding: 10px; background: #000; color: #fff; }
</style>
</head>
<body>

<h1>Browser Capability Report</h1>

<noscript>JavaScript is disabled, so nothing can be tested.</noscript>

<div id="info">
    <b>User agent</b> <span id="ua">?</span><br>
    <b>Platform</b> <span id="pf">?</span><br>
    <b>Language</b> <span id="lang">?</span><br>
    <b>Viewport</b> <span id="vp">?</span>
</div>

<div id="summary">Running&hellip;</div>

<div id="controls">
    <button id="show-all" class="on">All</button>
    <button id="show-missing">Missing only</button>
    <button id="select">Select text</button>
</div>

<textarea id="log" readonly wrap="off">If this text does not change, the script failed to start.</textarea>

<script>
// Deliberately ES3: the point of this page is to probe old engines (e.g. Kindle WebKit),
// so the page itself must parse on them. No let/const, arrows, template strings,
// default parameters, or Array.prototype extras.
(function () {
    var logEl = document.getElementById('log');
    var summaryEl = document.getElementById('summary');

    function text(id, value) {
        var el = document.getElementById(id);
        if (!el) { return; }
        if ('textContent' in el) { el.textContent = value; } else { el.innerText = value; }
    }

    function safe(fn, fallback) {
        try { var v = fn(); return (v === undefined || v === null || v === '') ? fallback : v; }
        catch (e) { return 'error: ' + e.message; }
    }

    // ------------------------------------------------------------------
    // Result model. Every check records { section, name, status, detail }.
    // status: 'yes' | 'no' | 'part'
    // ------------------------------------------------------------------
    var results = [];
    var section = '';
    var group = '';

    function record(name, status, detail) {
        results.push({ section: section, group: group, name: name, status: status, detail: detail || '' });
    }

    function getBase(getter) {
        try { return getter(); } catch (e) { return undefined; }
    }

    // Check that each listed member exists on an object and is a function.
    function methods(title, getter, list) {
        group = title;
        var base = getBase(getter);
        if (base === undefined || base === null) {
            record(title, 'no', 'object not available');
            return;
        }
        var names = list.split(' ');
        for (var i = 0; i < names.length; i++) {
            var m = names[i];
            if (!m) { continue; }
            var t;
            try {
                if (!(m in base)) { record(title + '.' + m, 'no'); continue; }
                t = typeof base[m];
            } catch (e) {
                // Prototype getters can throw "Illegal invocation"; presence is still proven.
                record(title + '.' + m, 'yes', 'present (access threw)');
                continue;
            }
            if (t === 'function') { record(title + '.' + m, 'yes'); }
            else { record(title + '.' + m, 'part', 'exists, typeof ' + t); }
        }
    }

    // Check that each listed member exists (any type).
    function props(title, getter, list) {
        group = title;
        var base = getBase(getter);
        if (base === undefined || base === null) {
            record(title, 'no', 'object not available');
            return;
        }
        var names = list.split(' ');
        for (var i = 0; i < names.length; i++) {
            var p = names[i];
            if (!p) { continue; }
            var ok = false;
            try { ok = p in base; } catch (e) { ok = false; }
            record(title + '.' + p, ok ? 'yes' : 'no');
        }
    }

    // Check that each listed global name exists as a function/constructor.
    function globals(title, list) {
        group = title;
        var names = list.split(' ');
        for (var i = 0; i < names.length; i++) {
            var g = names[i];
            if (!g) { continue; }
            var t;
            try { t = typeof window[g]; } catch (e) { t = 'error'; }
            if (t === 'function') { record(g, 'yes'); }
            else if (t === 'undefined') { record(g, 'no'); }
            else { record(g, 'part', 'typeof ' + t); }
        }
    }

    // Check whether a snippet of syntax parses (it is never executed for side effects).
    function syntax(title, list) {
        group = title;
        for (var i = 0; i < list.length; i++) {
            var ok = true;
            try { new Function(list[i][1]); } catch (e) { ok = false; }
            record(list[i][0], ok ? 'yes' : 'no');
        }
    }

    // Arbitrary boolean feature tests.
    function features(title, list) {
        group = title;
        for (var i = 0; i < list.length; i++) {
            var ok;
            try { ok = !!list[i][1](); } catch (e) { ok = false; }
            record(list[i][0], ok ? 'yes' : 'no');
        }
    }

    function proto(name) {
        return function () { return window[name] && window[name].prototype; };
    }

    var cssEl = document.createElement('div');
    function cssProp(prop) {
        return function () {
            if (prop in cssEl.style) { return true; }
            var cap = prop.charAt(0).toUpperCase() + prop.substring(1);
            return ('webkit' + cap in cssEl.style) || ('Moz' + cap in cssEl.style) || ('ms' + cap in cssEl.style);
        };
    }
    function cssValue(prop, value) {
        return function () {
            if (window.CSS && CSS.supports) { return CSS.supports(prop, value); }
            cssEl.style.cssText = prop + ':' + value;
            return cssEl.style.length > 0 || cssEl.style.cssText.length > 0;
        };
    }

    // ------------------------------------------------------------------
    // Test plan. Each step is one section, run on its own timer tick so
    // slow devices repaint between sections.
    // ------------------------------------------------------------------
    var plan = [];
    function step(title, fn) { plan.push({ title: title, fn: fn }); }

    step('JavaScript syntax', function () {
        syntax('Syntax', [
            ['let / const', 'let a = 1; const b = 2;'],
            ['Arrow functions', 'var f = (a) => a * 2;'],
            ['Template literals', 'var s = `x${1}`;'],
            ['Default parameters', 'function f(a = 1) {}'],
            ['Rest / spread', 'function f(...a) { return [...a]; }'],
            ['Destructuring', 'var { a, b } = {}; var [c] = [];'],
            ['Classes', 'class A { constructor() {} }'],
            ['Generators', 'function* g() { yield 1; }'],
            ['for...of', 'for (var x of []) {}'],
            ['Shorthand / computed props', 'var a = 1; var o = { a, ["b" + a]: 2, m() {} };'],
            ['Exponent operator', 'var x = 2 ** 3;'],
            ['async / await', 'async function f() { await 1; }'],
            ['Object spread', 'var o = { ...{} };'],
            ['Optional catch binding', 'try {} catch {}'],
            ['Optional chaining', 'var a = null; a?.b;'],
            ['Nullish coalescing', 'var a = null ?? 1;'],
            ['BigInt literal', 'var a = 1n;'],
            ['Logical assignment', 'var a; a ??= 1; a ||= 2; a &&= 3;'],
            ['Numeric separators', 'var a = 1_000;'],
            ['Class fields / private', 'class A { x = 1; #y = 2; static z = 3; }'],
            ['Getters / setters (ES5)', 'var o = { get a() { return 1; }, set a(v) {} };'],
            ['Trailing commas in calls', 'function f(a,) {} f(1,);']
        ]);
    });

    step('Core JavaScript', function () {
        methods('Object', function () { return Object; },
            'assign create defineProperty defineProperties entries freeze fromEntries getOwnPropertyDescriptor ' +
            'getOwnPropertyDescriptors getOwnPropertyNames getOwnPropertySymbols getPrototypeOf groupBy hasOwn is ' +
            'isExtensible isFrozen isSealed keys preventExtensions seal setPrototypeOf values');
        methods('Object.prototype', function () { return Object.prototype; },
            'hasOwnProperty isPrototypeOf propertyIsEnumerable toLocaleString toString valueOf ' +
            '__defineGetter__ __defineSetter__ __lookupGetter__ __lookupSetter__');
        methods('Array', function () { return Array; }, 'from fromAsync isArray of');
        methods('Array.prototype', function () { return Array.prototype; },
            'at concat copyWithin entries every fill filter find findIndex findLast findLastIndex flat flatMap ' +
            'forEach includes indexOf join keys lastIndexOf map pop push reduce reduceRight reverse shift slice ' +
            'some sort splice toReversed toSorted toSpliced unshift values with');
        methods('String', function () { return String; }, 'fromCharCode fromCodePoint raw');
        methods('String.prototype', function () { return String.prototype; },
            'at charAt charCodeAt codePointAt concat endsWith includes indexOf isWellFormed lastIndexOf ' +
            'localeCompare match matchAll normalize padEnd padStart repeat replace replaceAll search slice split ' +
            'startsWith substr substring toLocaleLowerCase toLocaleUpperCase toLowerCase toUpperCase toWellFormed ' +
            'trim trimEnd trimStart');
        methods('Number', function () { return Number; }, 'isFinite isInteger isNaN isSafeInteger parseFloat parseInt');
        methods('Number.prototype', function () { return Number.prototype; }, 'toExponential toFixed toLocaleString toPrecision toString');
        methods('Math', function () { return Math; },
            'abs acos acosh asin asinh atan atan2 atanh cbrt ceil clz32 cos cosh exp expm1 floor fround hypot imul ' +
            'log log10 log1p log2 max min pow random round sign sin sinh sqrt tan tanh trunc');
        methods('Date', function () { return Date; }, 'now parse UTC');
        methods('Date.prototype', function () { return Date.prototype; },
            'getDate getDay getFullYear getHours getMilliseconds getMinutes getMonth getSeconds getTime ' +
            'getTimezoneOffset getUTCDate getUTCFullYear setDate setFullYear setTime toDateString toISOString ' +
            'toJSON toLocaleDateString toLocaleString toLocaleTimeString toUTCString');
        methods('JSON', function () { return window.JSON; }, 'parse stringify');
        methods('RegExp.prototype', function () { return RegExp.prototype; }, 'exec test toString');
        features('RegExp flags', [
            ['RegExp sticky (y)', function () { return new RegExp('a', 'y'); }],
            ['RegExp unicode (u)', function () { return new RegExp('a', 'u'); }],
            ['RegExp dotAll (s)', function () { return new RegExp('a', 's'); }],
            ['RegExp indices (d)', function () { return new RegExp('a', 'd'); }],
            ['RegExp lookbehind', function () { return new RegExp('(?<=a)b'); }],
            ['RegExp named groups', function () { return new RegExp('(?<x>a)'); }]
        ]);
        methods('Function.prototype', function () { return Function.prototype; }, 'apply bind call toString');
        globals('Built-in constructors',
            'Map Set WeakMap WeakSet WeakRef FinalizationRegistry Promise Proxy Symbol ArrayBuffer DataView ' +
            'Int8Array Uint8Array Uint8ClampedArray Int16Array Uint16Array Int32Array Uint32Array Float32Array ' +
            'Float64Array BigInt BigInt64Array BigUint64Array SharedArrayBuffer');
        props('Global objects', function () { return window; }, 'Reflect Atomics Intl globalThis WebAssembly');
        methods('Map.prototype', proto('Map'), 'clear delete entries forEach get has keys set values');
        methods('Set.prototype', proto('Set'), 'add clear delete entries forEach has keys values union intersection difference');
        methods('WeakMap.prototype', proto('WeakMap'), 'delete get has set');
        methods('WeakSet.prototype', proto('WeakSet'), 'add delete has');
        methods('Promise', function () { return window.Promise; }, 'all allSettled any race reject resolve withResolvers');
        methods('Promise.prototype', proto('Promise'), 'catch finally then');
        methods('Intl', function () { return window.Intl; },
            'Collator DateTimeFormat DisplayNames ListFormat Locale NumberFormat PluralRules RelativeTimeFormat Segmenter getCanonicalLocales');
    });

    step('Window, document, navigator', function () {
        methods('window', function () { return window; },
            'addEventListener alert atob blur btoa cancelAnimationFrame cancelIdleCallback clearInterval ' +
            'clearTimeout close confirm fetch focus getComputedStyle getSelection matchMedia open postMessage ' +
            'print prompt queueMicrotask removeEventListener requestAnimationFrame requestIdleCallback scroll ' +
            'scrollBy scrollTo setInterval setTimeout structuredClone');
        methods('document', function () { return document; },
            'addEventListener adoptNode createAttribute createComment createDocumentFragment createElement ' +
            'createElementNS createEvent createRange createTextNode createTreeWalker elementFromPoint ' +
            'elementsFromPoint execCommand exitFullscreen getElementById getElementsByClassName ' +
            'getElementsByName getElementsByTagName hasFocus importNode querySelector querySelectorAll');
        props('document properties', function () { return document; },
            'activeElement body cookie documentElement fonts head hidden readyState visibilityState');
        methods('navigator', function () { return navigator; },
            'canShare getBattery getGamepads javaEnabled registerProtocolHandler sendBeacon share vibrate');
        props('navigator properties', function () { return navigator; },
            'clipboard connection cookieEnabled credentials deviceMemory geolocation hardwareConcurrency ' +
            'languages maxTouchPoints mediaDevices onLine permissions serviceWorker storage userAgentData wakeLock');
        props('screen', function () { return window.screen; }, 'availHeight availWidth colorDepth height orientation pixelDepth width');
        methods('history', function () { return window.history; }, 'back forward go pushState replaceState');
        methods('location', function () { return window.location; }, 'assign reload replace');
        methods('performance', function () { return window.performance; },
            'clearMarks clearMeasures getEntries getEntriesByName getEntriesByType mark measure now');
        methods('crypto', function () { return window.crypto; }, 'getRandomValues randomUUID');
        props('crypto.subtle', function () { return window.crypto; }, 'subtle');
    });

    step('DOM', function () {
        methods('EventTarget.prototype', proto('EventTarget'), 'addEventListener dispatchEvent removeEventListener');
        methods('Node.prototype', proto('Node'),
            'appendChild cloneNode compareDocumentPosition contains getRootNode hasChildNodes insertBefore ' +
            'isEqualNode isSameNode normalize removeChild replaceChild');
        methods('Element.prototype', proto('Element'),
            'after animate append attachShadow before closest getAttribute getAttributeNames ' +
            'getBoundingClientRect getClientRects getElementsByClassName getElementsByTagName hasAttribute ' +
            'insertAdjacentElement insertAdjacentHTML matches prepend querySelector querySelectorAll remove ' +
            'removeAttribute replaceChildren replaceWith requestFullscreen scrollIntoView setAttribute ' +
            'toggleAttribute webkitMatchesSelector');
        props('Element properties', function () { return document.documentElement; },
            'classList dataset children firstElementChild innerHTML outerHTML textContent');
        methods('HTMLElement.prototype', proto('HTMLElement'), 'blur click focus');
        globals('Observers', 'MutationObserver IntersectionObserver ResizeObserver PerformanceObserver');
        globals('Custom elements', 'customElements ShadowRoot HTMLTemplateElement HTMLSlotElement');
    });

    step('CSS', function () {
        features('CSS properties', [
            ['box-sizing', cssProp('boxSizing')],
            ['transform', cssProp('transform')],
            ['transition', cssProp('transition')],
            ['animation', cssProp('animation')],
            ['flexbox (display:flex)', cssValue('display', 'flex')],
            ['old flexbox (-webkit-box)', cssValue('display', '-webkit-box')],
            ['grid (display:grid)', cssValue('display', 'grid')],
            ['calc()', cssValue('width', 'calc(10px + 1em)')],
            ['vw / vh units', cssValue('width', '10vw')],
            ['custom properties (var)', cssValue('color', 'var(--x)')],
            ['position: sticky', cssValue('position', 'sticky')],
            ['object-fit', cssProp('objectFit')],
            ['filter', cssProp('filter')],
            ['gap', cssProp('gap')],
            ['aspect-ratio', cssProp('aspectRatio')]
        ]);
        methods('CSS', function () { return window.CSS; }, 'supports escape');
        features('Media queries', [
            ['matchMedia', function () { return window.matchMedia; }],
            ['prefers-color-scheme: dark', function () { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }],
            ['pointer: coarse', function () { return window.matchMedia && matchMedia('(pointer: coarse)').matches; }],
            ['hover: none', function () { return window.matchMedia && matchMedia('(hover: none)').matches; }],
            ['monochrome display', function () { return window.matchMedia && matchMedia('(monochrome)').matches; }]
        ]);
    });

    step('Graphics and media', function () {
        var canvas = document.createElement('canvas');
        methods('CanvasRenderingContext2D', function () { return canvas.getContext && canvas.getContext('2d'); },
            'arc arcTo beginPath bezierCurveTo clearRect clip closePath createImageData createLinearGradient ' +
            'createPattern createRadialGradient drawImage ellipse fill fillRect fillText getImageData ' +
            'getLineDash isPointInPath lineTo measureText moveTo putImageData quadraticCurveTo rect restore ' +
            'rotate roundRect save scale setLineDash setTransform stroke strokeRect strokeText transform translate');
        methods('HTMLCanvasElement', function () { return canvas; }, 'getContext toBlob toDataURL transferControlToOffscreen');
        features('WebGL', [
            ['WebGL 1', function () { var c = document.createElement('canvas'); return c.getContext && (c.getContext('webgl') || c.getContext('experimental-webgl')); }],
            ['WebGL 2', function () { var c = document.createElement('canvas'); return c.getContext && c.getContext('webgl2'); }],
            ['WebGPU', function () { return navigator.gpu; }]
        ]);
        globals('Graphics constructors', 'Image ImageData ImageBitmap OffscreenCanvas Path2D SVGElement createImageBitmap');
        methods('HTMLMediaElement.prototype', proto('HTMLMediaElement'), 'addTextTrack canPlayType load pause play');
        var audio = document.createElement('audio');
        features('Audio formats', [
            ['MP3', function () { return audio.canPlayType && audio.canPlayType('audio/mpeg'); }],
            ['OGG Vorbis', function () { return audio.canPlayType && audio.canPlayType('audio/ogg; codecs="vorbis"'); }],
            ['WAV', function () { return audio.canPlayType && audio.canPlayType('audio/wav'); }],
            ['AAC', function () { return audio.canPlayType && audio.canPlayType('audio/aac'); }]
        ]);
        globals('Audio', 'Audio AudioContext webkitAudioContext OfflineAudioContext speechSynthesis SpeechSynthesisUtterance MediaSource');
    });

    step('Networking and storage', function () {
        methods('XMLHttpRequest.prototype', proto('XMLHttpRequest'),
            'abort getAllResponseHeaders getResponseHeader open overrideMimeType send setRequestHeader');
        globals('Fetch API', 'fetch Request Response Headers AbortController AbortSignal FormData URL URLSearchParams Blob File FileReader TextEncoder TextDecoder ReadableStream');
        methods('Response.prototype', proto('Response'), 'arrayBuffer blob clone formData json text');
        methods('WebSocket.prototype', proto('WebSocket'), 'close send');
        methods('EventSource.prototype', proto('EventSource'), 'close');
        features('Storage', [
            ['localStorage usable', function () {
                var k = '__cap_test__';
                window.localStorage.setItem(k, '1');
                var ok = window.localStorage.getItem(k) === '1';
                window.localStorage.removeItem(k);
                return ok;
            }],
            ['sessionStorage usable', function () {
                var k = '__cap_test__';
                window.sessionStorage.setItem(k, '1');
                var ok = window.sessionStorage.getItem(k) === '1';
                window.sessionStorage.removeItem(k);
                return ok;
            }],
            ['cookies enabled', function () { return navigator.cookieEnabled; }],
            ['indexedDB', function () { return window.indexedDB; }],
            ['Cache API (caches)', function () { return window.caches; }],
            ['StorageManager.estimate', function () { return navigator.storage && navigator.storage.estimate; }]
        ]);
        methods('Storage.prototype', proto('Storage'), 'clear getItem key removeItem setItem');
        methods('indexedDB', function () { return window.indexedDB; }, 'cmp deleteDatabase databases open');
    });

    step('Workers', function () {
        globals('Worker constructors', 'Worker SharedWorker MessageChannel BroadcastChannel');
        methods('Worker.prototype', proto('Worker'), 'postMessage terminate');
        methods('MessagePort.prototype', proto('MessagePort'), 'close postMessage start');
        methods('navigator.serviceWorker', function () { return navigator.serviceWorker; }, 'getRegistration getRegistrations register');
        methods('ServiceWorkerRegistration.prototype', proto('ServiceWorkerRegistration'), 'getNotifications showNotification unregister update');
    });

    step('Events and input', function () {
        globals('Event constructors',
            'Event CustomEvent UIEvent MouseEvent KeyboardEvent TouchEvent PointerEvent FocusEvent ' +
            'WheelEvent InputEvent CompositionEvent');
        methods('Event.prototype', proto('Event'), 'composedPath preventDefault stopImmediatePropagation stopPropagation');
        features('Input', [
            ['touch events (ontouchstart)', function () { return 'ontouchstart' in window; }],
            ['pointer events', function () { return window.PointerEvent; }],
            ['passive listeners', function () {
                var passive = false;
                var opts = Object.defineProperty({}, 'passive', { get: function () { passive = true; return true; } });
                window.addEventListener('__cap_test__', null, opts);
                window.removeEventListener('__cap_test__', null, opts);
                return passive;
            }],
            ['Fullscreen API', function () { var d = document.documentElement; return d.requestFullscreen || d.webkitRequestFullscreen; }],
            ['Notification', function () { return window.Notification; }],
            ['Geolocation', function () { return navigator.geolocation; }],
            ['DeviceOrientationEvent', function () { return window.DeviceOrientationEvent; }]
        ]);
    });

    step('Web3 provider', function () {
        methods('window.ethereum', function () { return window.ethereum; },
            'request on removeListener isConnected enable sendAsync send');
    });

    // ------------------------------------------------------------------
    // Output
    // ------------------------------------------------------------------
    var showMissingOnly = false;
    var done = false;

    function pad(s, n) {
        while (s.length < n) { s += ' '; }
        return s;
    }

    function statusLabel(s) {
        return s === 'yes' ? 'yes ' : (s === 'no' ? 'NO  ' : 'part');
    }

    function draw() {
        var lines = [], lastSection = null, lastGroup = null;
        var yes = 0, no = 0, part = 0;
        for (var i = 0; i < results.length; i++) {
            var r = results[i];
            if (r.status === 'yes') { yes++; } else if (r.status === 'no') { no++; } else { part++; }
            if (showMissingOnly && r.status === 'yes') { continue; }
            if (r.section !== lastSection) {
                lines.push('');
                lines.push('=== ' + r.section.toUpperCase() + ' ===');
                lastSection = r.section;
                lastGroup = null;
            }
            if (r.group !== lastGroup) {
                lines.push('  ' + r.group);
                lastGroup = r.group;
            }
            lines.push('    [' + statusLabel(r.status) + '] ' + (r.detail ? pad(r.name, 44) + ' ' + r.detail : r.name));
        }
        if (!done) { lines.push(''); lines.push('... running ...'); }

        var header = 'Checked ' + results.length + ': ' + yes + ' yes, ' + no + ' missing, ' + part + ' partial';
        summaryEl.innerHTML = (done ? '' : 'Running&hellip; ') + header;
        logEl.value = header + '\n' + lines.join('\n');
    }

    function setFilter(missing) {
        showMissingOnly = missing;
        document.getElementById('show-all').className = missing ? '' : 'on';
        document.getElementById('show-missing').className = missing ? 'on' : '';
        draw();
    }

    function run(index) {
        if (index >= plan.length) {
            done = true;
            draw();
            logEl.scrollTop = 0;
            return;
        }
        section = plan[index].title;
        try { plan[index].fn(); }
        catch (e) { group = 'Runner'; record('section crashed', 'no', e.name + ': ' + e.message); }
        draw();
        setTimeout(function () { run(index + 1); }, 0);
    }

    function start() {
        text('ua', safe(function () { return navigator.userAgent; }, 'n/a'));
        text('pf', safe(function () { return navigator.platform; }, 'n/a'));
        text('lang', safe(function () { return navigator.language || navigator.userLanguage; }, 'n/a'));
        text('vp', safe(function () {
            var de = document.documentElement;
            return (window.innerWidth || de.clientWidth) + ' x ' + (window.innerHeight || de.clientHeight) +
                ' @ ' + (window.devicePixelRatio || 1) + 'x';
        }, 'n/a'));

        document.getElementById('show-all').onclick = function () { setFilter(false); };
        document.getElementById('show-missing').onclick = function () { setFilter(true); };
        document.getElementById('select').onclick = function () { logEl.focus(); logEl.select(); };

        logEl.value = 'Starting...';
        setTimeout(function () { run(0); }, 0);
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') { start(); }
    else if (window.addEventListener) { window.addEventListener('load', start, false); }
    else { window.onload = start; }
})();
</script>
</body>
</html>
